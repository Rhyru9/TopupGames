# Nginx — R9host production
# cp deploy/nginx-r9host.conf /etc/nginx/sites-available/r9host
# certbot --nginx -d r9host.com -d www.r9host.com

upstream r9host_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name r9host.com www.r9host.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://r9host_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client headers; app must only be reachable from this proxy.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
